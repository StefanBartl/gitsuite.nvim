# =============================================================================
# REFERENCE COPY of lazygit's config -- does NOT belong here, copy it into
# lazygit's own config directory for your OS:
#
#   Windows : %LOCALAPPDATA%\lazygit\config.yml
#   Linux   : ~/.config/lazygit/config.yml          ($XDG_CONFIG_HOME/lazygit)
#   macOS   : ~/Library/Application Support/lazygit/config.yml
#             (or ~/.config/lazygit/config.yml if $XDG_CONFIG_HOME is set)
#
# Print the correct path on any system with:
#   lazygit --print-config-dir     (or  lazygit -cd)
# =============================================================================

# customCommands: open files selected in lazygit in the Neovim instance
# lazygit was started from.
#   O      -> as a background buffer (buffer list +1, no focus/window change)
#   <C-o>  -> replaces the file currently visible in the editor (focus-safe,
#             lazygit stays open)
#
# Mechanism (cross-platform):
#   - Neovim sets $NVIM (its RPC server address) for terminal subprocesses --
#     including the lazygit float gitsuite.nvim opens (:Git ui lazygit).
#   - nvr reads $NVIM directly from the environment (no shell expansion
#     needed) and calls :GitsuiteLazygitBadd / :GitsuiteLazygitReplace in the
#     parent Neovim.
#   - `{{ printf "Verb %s" .SelectedFile.Name | quote }}` composes the Ex
#     command + filename into ONE string, then hands that whole string to
#     lazygit's `quote` template function, which wraps it as a single
#     platform-appropriate shell token. This is NOT cosmetic: a file name is
#     repo-controlled data (a cloned/untrusted repo picks it), and lazygit's
#     `command` is run through the OS shell -- an unescaped
#     `{{.SelectedFile.Name}}` inside a hand-written "..." wrapper lets a
#     crafted file name (backticks, `$(...)`, an embedded `"`) break out of
#     that wrapper and execute arbitrary shell commands the moment `O`/`<C-o>`
#     is pressed. `quote` must own the ENTIRE token, including the verb --
#     nesting it inside a second, hand-written pair of quotes reopens the
#     same hole, because a literal `"` surviving inside `quote`'s own
#     escaping still terminates the OUTER hand-written quote early.
#
# Requirement: `nvr` (neovim-remote) must be on $PATH.
#   pip install neovim-remote   (Arch: AUR neovim-remote, macOS: brew/pipx)
customCommands:
  - key: "O"
    context: "files"
    description: "Open file as background buffer in parent Neovim"
    command: 'nvr --nostart -c {{ printf "GitsuiteLazygitBadd %s" .SelectedFile.Name | quote }}'
    output: none
  - key: "O"
    context: "commitFiles"
    description: "Open file as background buffer in parent Neovim"
    command: 'nvr --nostart -c {{ printf "GitsuiteLazygitBadd %s" .SelectedCommitFile.Name | quote }}'
    output: none
  - key: "<c-o>"
    context: "files"
    description: "Replace visible editor buffer with file in parent Neovim"
    command: 'nvr --nostart -c {{ printf "GitsuiteLazygitReplace %s" .SelectedFile.Name | quote }}'
    output: none
  - key: "<c-o>"
    context: "commitFiles"
    description: "Replace visible editor buffer with file in parent Neovim"
    command: 'nvr --nostart -c {{ printf "GitsuiteLazygitReplace %s" .SelectedCommitFile.Name | quote }}'
    output: none
