name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (stylua + luacheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: stylua (check)
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck 1.2.0

      - name: luacheck
        run: luacheck lua TESTS

  test:
    name: tests (headless) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout gitsuite.nvim
        uses: actions/checkout@v5
        with:
          path: gitsuite.nvim

      - name: Checkout lib.nvim
        uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - name: Checkout diff.nvim
        uses: actions/checkout@v5
        with:
          repository: StefanBartl/diff.nvim
          path: diff.nvim
          ref: ci-verified

      - name: Checkout plenary.nvim
        uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          path: plenary.nvim
          # Pinned to the 2026-09-20 HEAD; bump deliberately, not by drifting.
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Run test suite
        working-directory: gitsuite.nvim
        # bash scripts/test.sh, not ./scripts/test.sh: the exec bit is not
        # what actually matters (nor reliably preserved through a Windows
        # git checkout) -- invoking the interpreter directly sidesteps it.
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          bash scripts/test.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-test-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14
